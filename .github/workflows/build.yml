name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - name: Restore
        run: dotnet restore engine/source/OfflineClient.csproj
      - name: Build (Release)
        run: dotnet build engine/source/OfflineClient.csproj -c Release --no-restore -warnaserror:false
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            engine/source/obj/**/*.log
          if-no-files-found: ignore
