name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  map-continuity:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - name: Build product for offline map checks
        working-directory: engine
        run: |
          dotnet restore source/OfflineClient.csproj --configfile ../.github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build source/OfflineClient.csproj -c Release --no-restore -o build/client-product-dev
      - name: Launcher preparation states T468 (synthetic files, no game or network)
        shell: pwsh
        run: |
          dotnet restore engine/_integration/dev/launcher-tests/LauncherChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/launcher-tests/LauncherChecks.csproj -c Release --no-restore -- .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise the actual WinExe dispatch/redirected stdout, with no client and with mixed-mode args.
          $env:TW_CLIENT_ROOT = ''
          foreach ($arguments in @(@('--prepare-assets'), @('--prepare-assets', '--normal-product'))) {
            $start = [System.Diagnostics.ProcessStartInfo]::new((Join-Path $PWD 'engine/build/client-product-dev/P11.ClientEngine.exe'))
            $start.UseShellExecute = $false; $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
            $start.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $child = [System.Diagnostics.Process]::Start($start)
            $stdout = $child.StandardOutput.ReadToEndAsync(); $stderr = $child.StandardError.ReadToEndAsync()
            if (!$child.WaitForExit(30000)) { $child.Kill(); throw 'Preparation dispatch timed out' }
            $text = $stdout.GetAwaiter().GetResult(); $errorText = $stderr.GetAwaiter().GetResult()
            Write-Output $text; Write-Output $errorText
            $result = $text | ConvertFrom-Json
            if ($child.ExitCode -ne 2 -or $result.status -ne 'prepare-failed' -or $result.uiStarted -or $result.networkStarted) { throw 'File-only preparation dispatch failed' }
            $child.Dispose()
          }
      - name: World module extension tests (all [WorldModuleTest] methods, no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-509 | Out-Null
          $out = Join-Path $PWD 'scratch/issue-509/module-tests.json'; $err = Join-Path $PWD 'scratch/issue-509/module-tests-error.json'
          $p = Start-Process -FilePath engine/build/client-product-dev/P11.ClientEngine.exe -ArgumentList '--module-tests', "`"$out`"", '--error-log', "`"$err`"" -Wait -PassThru -NoNewWindow
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path $err) { Get-Content $err }
          exit $p.ExitCode
      - name: Synthetic cave, ship, inn and map effect checks (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-140 | Out-Null
          dotnet restore engine/_integration/dev/demo-tests/DemoChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-140/map-checks.json map-continuity
