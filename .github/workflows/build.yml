name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  map-continuity:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - name: Build product for offline map checks
        working-directory: engine
        run: |
          dotnet restore source/OfflineClient.csproj --configfile ../.github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build source/OfflineClient.csproj -c Release --no-restore -o build/client-product-dev
      - name: World module extension tests (all [WorldModuleTest] methods, no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-509 | Out-Null
          $out = Join-Path $PWD 'scratch/issue-509/module-tests.json'; $err = Join-Path $PWD 'scratch/issue-509/module-tests-error.json'
          $p = Start-Process -FilePath engine/build/client-product-dev/P11.ClientEngine.exe -ArgumentList '--module-tests', "`"$out`"", '--error-log', "`"$err`"" -Wait -PassThru -NoNewWindow
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path $err) { Get-Content $err }
          exit $p.ExitCode
      - name: Synthetic cave, ship, inn and map effect checks (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-140 | Out-Null
          dotnet restore engine/_integration/dev/demo-tests/DemoChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-140/map-checks.json map-continuity
      - name: Combat admission contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-173 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-173/combat-checks.json combat-admission
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Item status and authoritative equipment contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-216 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-216/item-status-checks.json item-status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native UI resource layer with synthetic idx/pak/XML/img (no game assets)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-461 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-461/resource-checks.json native-ui-resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native UI canvas, scaling, input and switch (synthetic panels, no game assets)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-463 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-463/canvas-checks.json native-ui-canvas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native UI macro bar F5–F12, 3 tabs, lock, extended macro (synthetic, no game assets)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-466 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-466/macro-checks.json native-ui-macro
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native UI status (buff) icons, effectlist2 + .tbt, V3 order (synthetic, no game assets)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-473 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-473/buff-checks.json native-ui-buff-icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Affliction contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-388 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-388/afflictions.json afflictions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resurrection and move lock contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-414 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-414/resurrection.json resurrection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mail packet and lifecycle checks (no game or network)
        shell: pwsh
        run: |
          dotnet restore engine/_integration/dev/mail-tests/MailChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/mail-tests/MailChecks.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sound rules, S22 mode and packet media checks (no game or network)
        shell: pwsh
        run: |
          foreach ($t in @(@{p='sound-rules-tests/SoundRulesChecks'; d='issue-447'}, @{p='sound-packets-tests/SoundPacketChecks'; d='issue-192'})) {
            $proj = "engine/_integration/dev/$($t.p).csproj"; $name = Split-Path $t.p -Leaf
            dotnet restore $proj --configfile .github/nuget.ci.config
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build $proj -c Release --no-restore -o "scratch/$($t.d)/tests/bin"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet "scratch/$($t.d)/tests/bin/$name.dll" "scratch/$($t.d)/checks.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Weapon repair and PK checks (no game or network)
        shell: pwsh
        run: |
          dotnet restore engine/_integration/dev/weapon-repair-tests/WeaponRepairChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/weapon-repair-tests/WeaponRepairChecks.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Polymorph packet and cadence contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-263 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-263/polymorph-checks.json polymorph-cadence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Buddy and exclude contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-260 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-260/buddies.json buddies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Item transfer contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-273 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-273/item-transfer.json item-transfer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Door contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-322 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-322/doors.json doors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pickup alignment contracts T212 (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-518 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-518/pickup.json pickup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Door approach contracts T213 (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-519 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-519/door-approach.json door-approach
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: HyperText query result contracts T218 (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-524 | Out-Null
          dotnet run --project engine/_integration/dev/demo-tests/DemoChecks.csproj -c Release --no-restore -- . scratch/issue-524/hypertext.json hypertext
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Combat sound selection contracts (no game, assets or audio device)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-433 | Out-Null
          dotnet restore engine/_integration/dev/combat-sfx-tests/CombatSfxChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/combat-sfx-tests/CombatSfxChecks.csproj -c Release --no-restore -- . none scratch/issue-433/selection.json --selection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Player chat format, palette and channel contracts (no game or network)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-449 | Out-Null
          dotnet restore engine/_integration/dev/player-chat-tests/PlayerChatChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/player-chat-tests/PlayerChatChecks.csproj -c Release --no-restore -- . scratch/issue-449/chat-checks.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real WebView2 product page and local resource regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/issue-161 | Out-Null
          dotnet restore engine/_integration/dev/web-resource-tests/WebResourceChecks.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/web-resource-tests/WebResourceChecks.csproj -c Release --no-restore -- scratch/issue-161/product scratch/issue-161/product.json --product-page engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project engine/_integration/dev/web-resource-tests/WebResourceChecks.csproj -c Release --no-restore -- scratch/issue-161/legacy scratch/issue-161/legacy.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview-product-page-checks
          path: scratch/issue-161/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-continuity-checks
          path: scratch/issue-140/map-checks.json
          if-no-files-found: ignore
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Disable CRLF conversion (r35 lock pins exact bytes)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject tracked game assets
        run: python -B -X utf8 engine/tools/check-no-game-assets.py
      - name: Restore
        working-directory: engine
        run: dotnet restore source/OfflineClient.csproj --configfile ../.github/nuget.ci.config -p:EnableWindowsTargeting=true -r win-x64 -p:SelfContained=false
      - name: Build Windows target (Release, win-x64)
        working-directory: engine
        run: dotnet build source/OfflineClient.csproj -c Release --no-restore -warnaserror:false -p:EnableWindowsTargeting=true -r win-x64 -p:SelfContained=false
      - name: dev canonical build + receipt
        run: python -B -X utf8 engine/_integration/dev/rebuild.py --build --configfile .github/nuget.ci.config --write-receipt --output engine/_integration/evidence/ci-dev
      - name: Check compiled EmbeddedResource names (metadata only)
        working-directory: engine
        run: |
          dotnet restore tools/ResourceChecks/ResourceChecks.csproj --configfile ../.github/nuget.ci.config
          dotnet run --project tools/ResourceChecks/ResourceChecks.csproj -c Release --no-restore -- build/client-product-dev
      - name: Compile 6016 offline/native checks (Windows target only)
        working-directory: engine
        run: |
          dotnet restore _integration/dev/effect6016-tests/Effect6016Checks.csproj --configfile ../.github/nuget.ci.config -p:EnableWindowsTargeting=true
          dotnet build _integration/dev/effect6016-tests/Effect6016Checks.csproj -c Release --no-restore -p:EnableWindowsTargeting=true
      - name: Report local resource checks
        if: always()
        run: python -B -X utf8 engine/tools/check-local-resources.py --assets-root engine/assets
      - name: Restore packet trace checks (native Linux target)
        working-directory: engine
        run: dotnet restore _integration/dev/packet-trace-tests/PacketTraceChecks.csproj --configfile ../.github/nuget.ci.config
      - name: Packet trace checks (no game or network)
        working-directory: engine
        run: dotnet run --project _integration/dev/packet-trace-tests/PacketTraceChecks.csproj -c Release --no-restore
      - name: Report Windows-only validation skipped on Linux
        if: always() && runner.os == 'Linux'
        run: |
          echo "SKIP: Windows apphost execution, WinForms/WebView2 runtime, native UI/input/audio and game/login checks require Windows; cross-build success is not runtime acceptance."
          echo "SKIP: PacketTraceChecks uses a Linux symbolic link; Windows NTFS junction behavior still requires local Windows checks."
          echo "Follow-up: local Windows executor for automated checks; user/dot for authorized native acceptance."
      - name: Upload dev receipt and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-receipt
          path: |
            engine/_integration/dev/receipt.json
            engine/_integration/evidence/ci-dev/**
          if-no-files-found: ignore
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            engine/source/obj/**/*.log
          if-no-files-found: ignore
