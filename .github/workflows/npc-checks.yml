name: npc-offline
on:
  pull_request:
  push:
    branches: [main]
jobs:
  npc-offline:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - name: Restore product and offline checks
        run: |
          dotnet restore engine/source/OfflineClient.csproj --configfile .github/nuget.ci.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore engine/_integration/dev/npc-tests/NpcChecks.csproj --configfile .github/nuget.ci.config
      - name: Build production DLL (no game assets required)
        run: dotnet build engine/source/OfflineClient.csproj -c Release --no-restore -o engine/build/client-product-dev
      - name: NPC, warehouse, private shop, trade and meat packet cycles
        run: dotnet run --project engine/_integration/dev/npc-tests/NpcChecks.csproj -c Release --no-restore -- engine/build/npc-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-offline-checks
          path: engine/build/npc-checks.json
